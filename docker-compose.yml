name: greenmart

x-common: &common
  restart: unless-stopped
  networks: [greenmart]

services:
  postgres:
    <<: *common
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      FORECAST_DB_USER: ${FORECAST_DB_USER:?Set FORECAST_DB_USER}
      FORECAST_DB_PASSWORD: ${FORECAST_DB_PASSWORD:?Set FORECAST_DB_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    <<: *common
    image: redis:7.4.6-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    <<: *common
    image: rabbitmq:3.13.7-management-alpine
    command: [sh, /etc/rabbitmq/bootstrap.sh]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/bootstrap.sh:/etc/rabbitmq/bootstrap.sh:ro
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 10s
      timeout: 5s
      retries: 20
  backend:
    <<: *common
    build: ./backend
    image: greenmart-backend:${IMAGE_TAG:-dev}
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      TZ: Asia/Ho_Chi_Minh
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, 'http://localhost:8080/actuator/health/readiness']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
  mock-connector:
    <<: *common
    build: ./mock-connector
    image: greenmart-mock-connector:${IMAGE_TAG:-dev}
    environment:
      BACKEND_URL: http://backend:8080
      CHANNEL_WEB_SECRET: ${CHANNEL_WEB_SECRET:?Set CHANNEL_WEB_SECRET}
      CHANNEL_MARKET_SECRET: ${CHANNEL_MARKET_SECRET:?Set CHANNEL_MARKET_SECRET}
      STATE_FILE: /data/state.json
    ports: ['127.0.0.1:8090:8090']
    volumes: [mockdata:/data]
    depends_on:
      backend: {condition: service_healthy}
  forecast-service:
    <<: *common
    build: ./forecast-service
    image: greenmart-forecast:${IMAGE_TAG:-dev}
    environment:
      FORECAST_DB_HOST: postgres
      FORECAST_DB_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      FORECAST_DB_USER: ${FORECAST_DB_USER:?Set FORECAST_DB_USER}
      FORECAST_DB_PASSWORD: ${FORECAST_DB_PASSWORD:?Set FORECAST_DB_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      postgres: {condition: service_healthy}
      backend: {condition: service_healthy}
  frontend:
    <<: *common
    build: ./frontend
    image: greenmart-frontend:${IMAGE_TAG:-dev}
    ports: ['127.0.0.1:3000:8080']
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 12
networks:
  greenmart: {}
volumes:
  pgdata: {}
  rabbitdata: {}
  mockdata: {}
