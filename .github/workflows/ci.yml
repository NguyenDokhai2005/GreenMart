name: CI
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run generate:api-types && git diff --exit-code -- src/api/schema.ts
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm run format:check && npm test -- --run && npm run build
        working-directory: frontend
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt && python -m pytest
        working-directory: forecast-service
  mock-connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test mock-connector/test/connector.test.js
      - run: docker build -t greenmart-mock-connector:ci mock-connector
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t greenmart-backend:ci backend
      - run: docker build -t greenmart-frontend:ci frontend
      - run: docker build -t greenmart-forecast:ci forecast-service
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [backend, frontend, forecast, mock-connector, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Deploy the tested commit and check readiness
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?Missing STAGING_HOST}" "${STAGING_USER:?Missing STAGING_USER}"
          : "${STAGING_SSH_KEY:?Missing STAGING_SSH_KEY}" "${STAGING_KNOWN_HOSTS:?Missing STAGING_KNOWN_HOSTS}"
          [[ "$STAGING_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ && "$STAGING_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          umask 077
          auth=$(mktemp -d)
          trap 'rm -f "$auth/key" "$auth/known_hosts"; rmdir "$auth"' EXIT
          printf '%s\n' "$STAGING_SSH_KEY" > "$auth/key"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$auth/known_hosts"
          ssh -i "$auth/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$auth/known_hosts" \
            -o ConnectTimeout=10 "$STAGING_USER@$STAGING_HOST" "bash -s -- $GITHUB_SHA" < scripts/deploy-staging.sh
