# Tests drive the relay explicitly; no background polling against stopped Testcontainers.
greenmart.outbox.enabled=false
greenmart.inventory.replenishment.cron=-
greenmart.promotion.expiry.cron=-
greenmart.jwt.secret=test-only-jwt-secret-at-least-32-bytes-long
# Cached test contexts can outlive their PostgreSQL containers.
spring.datasource.hikari.minimum-idle=0
