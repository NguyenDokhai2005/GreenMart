spring:
  application:
    name: greenmart
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/greenmart}
    username: ${POSTGRES_USER:greenmart}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Placeholder cho V2__grant_forecast.sql
    placeholders:
      forecast_user: ${FORECAST_DB_USER:forecast_ro}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      password: ${REDIS_PASSWORD}
      connect-timeout: 3s
      timeout: 3s
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_DEFAULT_USER:greenmart}
    password: ${RABBITMQ_DEFAULT_PASS}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          # Boot 4 counts retries after the initial delivery (5 deliveries total).
          max-retries: 4
          initial-interval: 1s
          multiplier: 2
          max-interval: 16s
server:
  error:
    include-stacktrace: never
    include-message: never
greenmart:
  jwt:
    secret: ${JWT_SECRET}
logging:
  structured:
    format:
      console: logstash
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState

# Preserve the existing Jackson 2 wire format during the Boot 4 migration.
spring.http.converters.preferred-json-mapper: jackson2
